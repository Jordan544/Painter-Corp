<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <title>Painter Corp</title>
  <style>
    :root {
  --bg: #f6f7fb;
  --card: #ffffff;
  --ink: #1d2433;
  --muted: #6b7385;
  --brand: #e4572e;
  --brand-dark: #c4431f;
  --accent: #2a6f97;
  --ok: #2e9d5b;
  --warn: #d9941a;
  --bad: #c93a3a;
  --line: #e3e6ee;
  --radius: 12px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
.hidden { display: none !important; }

.topbar {
  background: var(--ink);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 20px;
  flex-wrap: wrap;
  gap: 10px;
}
.brand { font-weight: 700; font-size: 1.25rem; cursor: pointer; }
nav { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
nav button, nav span { font-size: .9rem; }
nav span { color: #c9cfdd; margin-right: 6px; }

/* Main content now spans at least 90% of the viewport width */
main {
  flex: 1;
  width: 90%;
  min-width: 90%;
  max-width: none;
  margin: 0 auto;
  padding: 24px 16px;
}
.footer { text-align: center; color: var(--muted); font-size: .8rem; padding: 16px; }

h1, h2, h3 { margin: 0 0 12px; }
h1 { font-size: 1.7rem; }
p.lead { color: var(--muted); margin-top: 0; }

.btn {
  background: var(--brand);
  color: #fff;
  border: 0;
  padding: 9px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: .92rem;
  font-weight: 600;
}
.btn:hover { background: var(--brand-dark); }
.btn.secondary { background: transparent; border: 1px solid var(--line); color: var(--ink); }
nav .btn.secondary { color: #fff; border-color: #4a5370; }
.btn.secondary:hover { background: rgba(120,130,160,.15); }
.btn.ok { background: var(--ok); }
.btn.bad { background: var(--bad); }
.btn.small { padding: 6px 11px; font-size: .82rem; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 18px;
}
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.painter-card { padding: 0; overflow: hidden; display: flex; flex-direction: column; }
.painter-card .cover { height: 150px; background-color: #e4572e; background-size: cover; background-position: center; }
.painter-card .body { padding: 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.painter-card .name { font-weight: 700; font-size: 1.05rem; }

.badge {
  display: inline-block;
  padding: 2px 9px;
  border-radius: 999px;
  font-size: .75rem;
  font-weight: 600;
  background: #eceff6;
  color: var(--muted);
}
.badge.ok { background: #e1f4e8; color: var(--ok); }
.badge.warn { background: #fdf0d6; color: var(--warn); }
.badge.bad { background: #fbe3e3; color: var(--bad); }
.muted { color: var(--muted); font-size: .88rem; }

label { display: block; font-weight: 600; font-size: .85rem; margin: 12px 0 5px; }
input, select, textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  font: inherit;
  background: #fff;
}
textarea { min-height: 90px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid #f1b9a6; border-color: var(--brand); }
.row { display: flex; gap: 12px; flex-wrap: wrap; }
.row > * { flex: 1; min-width: 160px; }

.auth-wrap { max-width: 420px; margin: 20px auto; }
.tabs { display: flex; gap: 6px; margin-bottom: 18px; flex-wrap: wrap; }
.tab { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: #fff; cursor: pointer; font-weight: 600; font-size: .88rem; }
.tab.active { background: var(--ink); color: #fff; border-color: var(--ink); }

table { width: 100%; border-collapse: collapse; font-size: .9rem; }
th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { color: var(--muted); font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; }
.table-wrap { overflow-x: auto; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-bottom: 18px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.stat .num { font-size: 1.7rem; font-weight: 800; }
.stat .lbl { color: var(--muted); font-size: .82rem; }

.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.gallery .shot { position: relative; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: #fff; }
.gallery img { width: 100%; height: 120px; object-fit: cover; display: block; }
.gallery .cap { padding: 6px 8px; font-size: .8rem; }
.gallery .del { position: absolute; top: 5px; right: 5px; }

.contact-box { background: #e9f6ee; border: 1px solid #bfe3cc; border-radius: 10px; padding: 14px; }
.locked-box { background: #fdf4e3; border: 1px dashed #e5b858; border-radius: 10px; padding: 14px; }

.pay-methods { display: flex; gap: 10px; margin: 8px 0; }
.pay-methods .tab { flex: 1; text-align: center; }

.modal { position: fixed; inset: 0; background: rgba(20,24,36,.55); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; overflow-y: auto; }
.modal-card { background: #fff; border-radius: 14px; padding: 22px; width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto; }
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 10px; z-index: 99; font-size: .9rem; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
.toast.error { background: var(--bad); }

.hint { background: #eef4fa; border: 1px solid #cfe0ef; color: #2a4a66; padding: 10px 12px; border-radius: 8px; font-size: .84rem; margin-top: 14px; }
.hero { background: #2a3550; color: #fff; border-radius: 16px; padding: 28px 24px; margin-bottom: 22px; }
.hero p { color: #d0d6ea; margin: 6px 0 0; }
.back { margin-bottom: 14px; }

@media (max-width: 600px) {
  h1 { font-size: 1.35rem; }
  .topbar { padding: 10px 12px; }
  main { width: 100%; min-width: 100%; padding: 18px 12px; }
}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand" id="brand">Painter Corp</div>
    <nav id="nav"></nav>
  </header>

  <main id="app"></main>

  <div id="toast" class="toast hidden"></div>
  <div id="modal" class="modal hidden">
    <div class="modal-card" id="modalCard"></div>
  </div>

  <footer class="footer">Painter Corp — test prototype. Payments are simulated; data is stored in this browser only.</footer>

  <script>
    (() => {
  'use strict';

  // NOTE: bumped from v1 to v2 so browsers holding the old 4-painter DB
  // automatically re-seed with the new 24-painter catalogue.
  const DB_KEY = 'painterCorpDB_v2';
  const SESSION_KEY = 'painterCorpSession_v1';
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const uid = () => Math.random().toString(36).slice(2, 10);
  const money = (n) => '$' + Number(n || 0).toFixed(2);
  const fmtDate = (t) => new Date(t).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });

  function art(a, b, label) {
    const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='600' height='400'><rect width='600' height='400' fill='${a}'/><rect x='170' y='150' width='260' height='170' fill='rgba(255,255,255,.88)'/><polygon points='150,150 300,70 450,150' fill='rgba(0,0,0,.3)'/><rect x='275' y='230' width='50' height='90' fill='${b}'/><text x='300' y='365' font-size='26' text-anchor='middle' fill='white' font-family='sans-serif'>${label}</text></svg>`;
    return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
  }

  function seed() {
    const now = Date.now();
    const day = 86400000;
    const db = {
      settings: { painterFee: 30, bookingFee: 10 },
      users: [], works: [], payments: [], bookings: [],
    };
    db.users.push({ id: 'u_admin', role: 'admin', name: 'Owner', email: 'admin@painter.corp', password: 'admin123', phone: '' });
    db.users.push({ id: 'u_c1', role: 'client', name: 'Demo Client', email: 'client@demo.com', password: 'demo123', phone: '+000 700 100 200', joined: now - 6 * day });
    db.users.push({ id: 'u_c2', role: 'client', name: 'Sarah Nakato', email: 'sarah@demo.com', password: 'demo123', phone: '+000 700 200 300', joined: now - 14 * day });
    db.users.push({ id: 'u_c3', role: 'client', name: 'Moses Okello', email: 'moses@demo.com', password: 'demo123', phone: '+000 700 300 400', joined: now - 3 * day });

    const painters = [
      { id: 'u_p1', name: 'Brightside Painters', email: 'bright@demo.com', phone: '+000 700 000 111', location: 'Kampala near City Square', specialties: 'Interior, Exterior', rate: 'From 50,000 UGX', bio: 'Family-run team with 12 years of experience painting homes and small offices. Clean work, fair prices.', available: true, status: 'approved' },
      { id: 'u_p2', name: 'Color Masters Ltd', email: 'colors@demo.com', phone: '+000 700 000 222', location: 'Namasuba opposite Freedom City', specialties: 'Commercial buildings, Exterior', rate: 'Quote per project', bio: 'We handle large commercial buildings, warehouses and apartment blocks with our own scaffolding crew.', available: true, status: 'approved' },
      { id: 'u_p3', name: 'Fresh Coat Studio', email: 'fresh@demo.com', phone: '+000 700 000 333', location: 'Nakawa opposite Capital Shoppers ltd', specialties: 'Interior, Decorative', rate: 'From 100,000 UGX', bio: 'Decorative finishes, murals and accent walls.', available: false, status: 'pending' },
      { id: 'u_p4', name: 'Quick Roller', email: 'roller@demo.com', phone: '+000 700 000 444', location: 'Bulenga', specialties: 'Fences, Gates', rate: 'From 10,000 UGX', bio: 'Fast and affordable fence and gate painting.', available: true, status: 'unpaid' },
      { id: 'u_p5', name: 'Rainbow Brush Co.', email: 'rainbow@demo.com', phone: '+000 700 000 555', location: 'Kira Road, Kamwokya', specialties: 'Interior, Kids rooms', rate: 'From 60,000 UGX', bio: 'Bright, playful interiors for family homes and nurseries. We love colour.', available: true, status: 'approved' },
      { id: 'u_p6', name: 'Elite Walls & Finishes', email: 'elite@demo.com', phone: '+000 700 000 666', location: 'Kololo, near Acacia Mall', specialties: 'Luxury interiors, Textured finishes', rate: 'From 150,000 UGX', bio: 'High-end decorative finishes, Venetian plaster and metallic accents for upmarket homes.', available: true, status: 'approved' },
      { id: 'u_p7', name: 'Sunrise Painting Services', email: 'sunrise@demo.com', phone: '+000 700 000 777', location: 'Wakiso, Gayaza Road', specialties: 'Exterior, Roof coating', rate: 'Quote per project', bio: 'Exterior repaints and weather-proof roof coatings. We work all year round.', available: false, status: 'approved' },
      { id: 'u_p8', name: 'ProCoat Contractors', email: 'procoat@demo.com', phone: '+000 700 000 888', location: 'Industrial Area, 7th Street', specialties: 'Industrial, Epoxy floors', rate: 'Quote per project', bio: 'Industrial coatings, epoxy floors and warehouse line marking for factories.', available: true, status: 'approved' },
      { id: 'u_p9', name: 'Golden Roller Painters', email: 'golden@demo.com', phone: '+000 700 000 999', location: 'Bweyogerere', specialties: 'Interior, Exterior', rate: 'From 45,000 UGX', bio: 'New team on Painter Corp — competitive prices and quick turnaround.', available: true, status: 'unpaid' },
      { id: 'u_p10', name: 'Summit Painting Group', email: 'summit@demo.com', phone: '+000 700 001 010', location: 'Muyenga, Tank Hill', specialties: 'Residential, Exterior', rate: 'From 70,000 UGX', bio: 'Hillside villas and apartment repaints. Free site visit anywhere in Kampala.', available: true, status: 'approved' },
      { id: 'u_p11', name: 'Urban Finish Painters', email: 'urbanfinish@demo.com', phone: '+000 700 001 111', location: 'Bukoto, Kisaasi Road', specialties: 'Interior, Office fit-outs', rate: 'From 55,000 UGX', bio: 'Fast office and shop fit-out painting, done after hours if needed.', available: true, status: 'pending' },
      { id: 'u_p12', name: 'Classic Coat Painters', email: 'classic@demo.com', phone: '+000 700 001 212', location: 'Entebbe Road, Kajjansi', specialties: 'Exterior, Fences', rate: 'From 35,000 UGX', bio: 'Traditional, reliable painting for homes along Entebbe Road.', available: false, status: 'approved' },
      { id: 'u_p13', name: 'Prime Paint Solutions', email: 'primepaint@demo.com', phone: '+000 700 001 313', location: 'Ntinda, near Capital Shoppers', specialties: 'Commercial, Interior', rate: 'Quote per project', bio: 'Supermarkets, schools and clinics. We work around your opening hours.', available: true, status: 'approved' },
      { id: 'u_p14', name: 'EcoPaint Uganda', email: 'ecopaint@demo.com', phone: '+000 700 001 414', location: 'Bugolobi, Spring Road', specialties: 'Eco-friendly, Interior', rate: 'From 80,000 UGX', bio: 'Low-VOC, child-safe paints for homes, clinics and schools.', available: true, status: 'approved' },
      { id: 'u_p15', name: 'Delta Decorators', email: 'delta@demo.com', phone: '+000 700 001 515', location: 'Masaka Road, Ndeeba', specialties: 'Decorative, Wallpaper', rate: 'From 90,000 UGX', bio: 'Wallpaper hanging, wall textures and decorative feature walls.', available: true, status: 'unpaid' },
      { id: 'u_p16', name: 'Skyline Painting Crew', email: 'skyline@demo.com', phone: '+000 700 001 616', location: 'Najjera, Buwate', specialties: 'High-rise, Exterior', rate: 'Quote per project', bio: 'Rope-access and scaffolding crews for tall buildings and apartment blocks.', available: true, status: 'approved' },
      { id: 'u_p17', name: 'Artistic Touch Painters', email: 'artistic@demo.com', phone: '+000 700 001 717', location: 'Nsambya, Ggaba Road', specialties: 'Murals, Decorative', rate: 'From 120,000 UGX', bio: 'Hand-painted murals, logos and signage for shops, cafés and schools.', available: false, status: 'approved' },
      { id: 'u_p18', name: 'Solid Coat Services', email: 'solidcoat@demo.com', phone: '+000 700 001 818', location: 'Kawempe, Bombo Road', specialties: 'Interior, Exterior', rate: 'From 40,000 UGX', bio: 'Straightforward, honest painting work. Free quotes on site.', available: true, status: 'pending' },
      { id: 'u_p19', name: 'Metro Painters Hub', email: 'metro@demo.com', phone: '+000 700 001 919', location: 'Kampala Central, William Street', specialties: 'Commercial, Interior', rate: 'Quote per project', bio: 'A network of 20 vetted painters for large jobs with tight deadlines.', available: true, status: 'approved' },
      { id: 'u_p20', name: 'Village Brush Painters', email: 'village@demo.com', phone: '+000 700 002 020', location: 'Matugga, Wakiso', specialties: 'Rural homes, Fences', rate: 'From 25,000 UGX', bio: 'Affordable painting for village homes, schools and churches.', available: true, status: 'approved' },
      { id: 'u_p21', name: 'Royal Finish Painters', email: 'royal@demo.com', phone: '+000 700 002 121', location: 'Bunga, Ggaba Road', specialties: 'Luxury interiors', rate: 'From 200,000 UGX', bio: 'Premium finishes for luxury homes and hotels.', available: false, status: 'dismissed' },
      { id: 'u_p22', name: 'Crestline Painting Co.', email: 'crestline@demo.com', phone: '+000 700 002 222', location: 'Kyanja, Kisaasi', specialties: 'Residential, Exterior', rate: 'From 65,000 UGX', bio: 'New builds and renovations. We prep surfaces properly before painting.', available: true, status: 'approved' },
      { id: 'u_p23', name: 'Bright Future Painters', email: 'brightfuture@demo.com', phone: '+000 700 002 323', location: 'Seeta, Mukono', specialties: 'Interior, Exterior', rate: 'From 38,000 UGX', bio: 'Young crew, modern equipment, friendly service.', available: true, status: 'unpaid' },
      { id: 'u_p24', name: 'Harmony Paint Works', email: 'harmony@demo.com', phone: '+000 700 002 424', location: 'Lubowa, Entebbe Road', specialties: 'Interior, Colour consulting', rate: 'From 75,000 UGX', bio: 'We help you choose a colour scheme, then paint it perfectly.', available: false, status: 'approved' },
    ];
    painters.forEach((p, i) => db.users.push({ ...p, role: 'painter', password: 'demo123', joined: now - (30 - i) * day }));

    const mkWork = (pid, title, desc, a, b, ago) => db.works.push({ id: 'w_' + uid(), painterId: pid, title, desc, image: art(a, b, title), createdAt: now - ago * day });

    mkWork('u_p1', 'Family Home Exterior', 'Two-storey house, weather-proof finish.', '#e4572e', '#f2a65a', 4);
    mkWork('u_p1', 'Modern Living Room', 'Soft grey walls with a white ceiling.', '#5c6b8a', '#9fb1d1', 3);
    mkWork('u_p2', 'Apartment Block', '6-floor apartment building repaint.', '#2a6f97', '#61a5c2', 5);
    mkWork('u_p2', 'Warehouse Facade', 'Industrial coating, 1,200 m².', '#3d5a40', '#7fa37f', 2);
    mkWork('u_p3', 'Accent Wall Mural', 'Hand-painted botanical mural.', '#8e44ad', '#d2a4e8', 1);
    mkWork('u_p5', 'Nursery Makeover', 'Pastel walls with a cloud mural.', '#f7a8b8', '#ffd9e0', 6);
    mkWork('u_p5', 'Kitchen & Dining', 'Washable satin finish, two tones.', '#2f8f83', '#7fd0c6', 2);
    mkWork('u_p6', 'Master Bedroom Suite', 'Textured feature wall with gold accents.', '#6b4a7a', '#c9a7d6', 7);
    mkWork('u_p6', 'Hotel Corridor', 'Durable scuff-resistant finish.', '#8a6b3f', '#d9bb8b', 3);
    mkWork('u_p7', 'Bungalow Exterior', 'Full exterior repaint, three coats.', '#b5651d', '#e8b07a', 9);
    mkWork('u_p8', 'Factory Floor Coating', 'Epoxy floor, 2,000 m².', '#4a4f57', '#9aa1ab', 8);
    mkWork('u_p8', 'Warehouse Line Marking', 'Safety lines and bay numbering.', '#c9a227', '#f0dd8a', 4);
    mkWork('u_p10', 'Hillside Villa', 'Exterior plus boundary wall.', '#3a6ea5', '#8ab6dd', 5);
    mkWork('u_p10', 'Apartment Common Areas', 'Stairwells and corridors.', '#5a5f7a', '#a9aec9', 2);
    mkWork('u_p11', 'Office Fit-out', 'Open-plan office, 400 m².', '#2b7a78', '#8fd4d1', 3);
    mkWork('u_p12', 'Boundary Wall & Gate', 'Masonry paint, 180 metres.', '#7a5230', '#c49a6c', 10);
    mkWork('u_p13', 'Supermarket Interior', 'Ceiling, walls and pillars.', '#c1440e', '#f0a07a', 6);
    mkWork('u_p13', 'Primary School Block', 'Classrooms repainted in a week.', '#1f7a4d', '#8ed4ab', 2);
    mkWork('u_p14', 'Clinic Interior', 'Low-VOC, washable, child-safe.', '#2e9d5b', '#a8e6c0', 4);
    mkWork('u_p16', '9-Storey Facade', 'Rope-access exterior repaint.', '#26456e', '#7f9fc9', 7);
    mkWork('u_p16', 'Apartment Towers', 'Two blocks, 14 floors total.', '#6c757d', '#bfc5cc', 3);
    mkWork('u_p17', 'Café Mural', 'Tropical mural on a 6 m wall.', '#e07a5f', '#f6c6b5', 5);
    mkWork('u_p18', 'Rental Units Repaint', 'Four units, quick turnaround.', '#4f6d7a', '#a9c6d1', 4);
    mkWork('u_p19', 'Shopping Arcade', 'Common areas and shop fronts.', '#8e6c3f', '#dcc39a', 6);
    mkWork('u_p19', 'Corporate Offices', 'After-hours painting, three nights.', '#3d3d6b', '#9a9ac9', 2);
    mkWork('u_p20', 'Village School', 'Three classroom blocks.', '#b07d3a', '#e6c79a', 11);
    mkWork('u_p21', 'Boutique Hotel Lobby', 'Decorative plaster and gold leaf.', '#7d5a2f', '#e0c48a', 12);
    mkWork('u_p22', 'New Build Handover', 'Full interior, five bedrooms.', '#38618c', '#96b8dd', 5);
    mkWork('u_p22', 'Duplex Exterior', 'Weather shield in two tones.', '#4a7856', '#a3c9a8', 1);
    mkWork('u_p24', 'Colour Consult + Paint', 'Whole-house scheme and paint.', '#a4508b', '#e0a8d1', 3);

    const pay = (type, payerId, painterId, amount, method, detail, ago) => {
      const p = { id: 'pay_' + uid(), type, payerId, painterId, amount, method, detail, ref: 'PC-' + uid().toUpperCase(), status: 'received', createdAt: now - ago * day };
      db.payments.push(p); return p;
    };

    // Every painter that is not "unpaid" has paid the listing fee.
    db.users.filter((u) => u.role === 'painter' && u.status !== 'unpaid').forEach((p, i) => {
      const tail = String(1000 + i * 7).slice(-4);
      pay('painter_fee', p.id, p.id, db.settings.painterFee, i % 2 ? 'mobile' : 'card',
        i % 2 ? `Mobile money •••• ${tail}` : `Visa •••• ${tail}`, 1 + (i * 3) % 45);
    });

    const mkBooking = (clientId, painterId, jobType, location, details, ago) => {
      const pmt = pay('booking', clientId, painterId, db.settings.bookingFee, 'card', 'Visa •••• 4242', ago);
      db.bookings.push({ id: 'b_' + uid(), clientId, painterId, jobType, location, details, fee: pmt.amount, paymentId: pmt.id, createdAt: now - ago * day });
    };
    mkBooking('u_c1', 'u_p1', 'Interior', 'Apartment 4B, Central Street', 'Two bedrooms and a hallway, about 90 m².', 1);
    mkBooking('u_c1', 'u_p5', 'Interior', 'House 12, Kira Road', 'Kids room and living room, pastel colours.', 5);
    mkBooking('u_c2', 'u_p2', 'Commercial building', 'Shop on Kampala Road', 'Ground floor shop front and interior.', 8);
    mkBooking('u_c2', 'u_p16', 'Exterior', 'Apartment block, Najjera', 'Two-storey exterior, scaffolding needed.', 3);
    mkBooking('u_c3', 'u_p10', 'Exterior', 'Villa in Muyenga', 'Full exterior and boundary wall.', 2);

    return db;
  }

  let db = load();

  function load() {
    // If a stored DB exists but was created by an older seed (fewer painters),
    // discard it and re-seed so new demo data always shows up.
    try {
      const raw = localStorage.getItem(DB_KEY);
      if (raw) {
        const stored = JSON.parse(raw);
        const storedPainters = (stored.users || []).filter((u) => u.role === 'painter').length;
        const expectedPainters = 24; // keep in sync with the seed() painter list
        if (storedPainters >= expectedPainters) return stored;
        // otherwise fall through and re-seed
      }
    } catch (e) { /* fall through to re-seed */ }

    const fresh = seed();
    try { localStorage.setItem(DB_KEY, JSON.stringify(fresh)); } catch (e) {}
    return fresh;
  }

  function save() {
    try { localStorage.setItem(DB_KEY, JSON.stringify(db)); return true; }
    catch (e) { toast('Browser storage is full — try smaller or fewer images.', true); return false; }

  function render() {
    const u = sessionUser();
    if (!u) S.view = 'auth';
    else if (S.view === 'auth') S.view = defaultView(u);

    const allowed = { client: ['browse', 'painter', 'bookings'], painter: ['pdash', 'painter'], admin: ['admin', 'browse', 'painter'] };
    if (u && !allowed[u.role].includes(S.view)) S.view = defaultView(u);

    renderNav(u);
    let html = '';
    switch (S.view) {
      case 'auth': html = viewAuth(); break;
      case 'browse': html = viewBrowse(); break;
      case 'painter': html = viewPainter(S.param); break;
      case 'bookings': html = viewBookings(); break;
      case 'pdash': html = viewPainterDash(); break;
      case 'admin': html = viewAdmin(); break;
    }
    $('#app').innerHTML = html;
  }

  let payCtx = null;
  const luhn = (n) => { let s = 0, alt = false; for (let i = n.length - 1; i >= 0; i--) { let d = +n[i]; if (alt) { d *= 2; if (d > 9) d -= 9; } s += d; alt = !alt; } return s % 10 === 0; };

  function openPay(ctx) { payCtx = { ...ctx, method: 'card' }; renderPay(); }
  function renderPay() {
    const c = payCtx; if (!c) return;
    showModal(`
      <h2>Pay ${money(c.amount)}</h2>

      </div>

        ${c.method === 'card' ? `
          <label>Name on card</label><input name="cardName" required autocomplete="off">
          <label>Card number</label><input name="cardNo" id="cc" inputmode="numeric" placeholder="4242 4242 4242 4242" required autocomplete="off">
          <div class="row">
            <div><label>Expiry (MM/YY)</label><input name="exp" id="exp" placeholder="12/29" required autocomplete="off"></div>
            <div><label>CVV</label><input name="cvv" inputmode="numeric" maxlength="4" placeholder="123" required autocomplete="off"></div>
          </div>
          <div class="hint">Test mode: use card 4242 4242 4242 4242, any future expiry, any 3-digit CVV. Card details are never saved.</div>`
        : `
          <label>Provider</label>
          <select name="provider"><option>MTN Mobile Money</option><option>Airtel Money</option><option>M-Pesa</option><option>Other mobile money</option></select>
          <label>Mobile money number</label><input name="momoNo" inputmode="tel" placeholder="0700 000 000" required>
          <div class="hint">Test mode: no real request is sent. In production, a prompt would appear on this phone to approve the payment.</div>`}
        <p style="display:flex;gap:8px;margin-top:16px"><button class="btn" id="payBtn" style="flex:1">Pay ${money(c.amount)}</button>
        <button type="button" class="btn secondary" data-act="close-modal">Cancel</button></p>
      </form>`);
  }

  function finishPay(f) {
    const c = payCtx; const d = Object.fromEntries(new FormData(f));
    let detail;
    if (c.method === 'card') {
      const num = (d.cardNo || '').replace(/\s+/g, '');
      if (!/^\d{13,19}$/.test(num) || !luhn(num)) return toast('Card number is not valid.', true);
      const m = (d.exp || '').match(/^(\d{2})\/(\d{2})$/);
      if (!m || +m[1] < 1 || +m[1] > 12) return toast('Expiry must look like MM/YY.', true);
      const expDate = new Date(2000 + +m[2], +m[1], 1);
      if (expDate <= new Date()) return toast('This card has expired.', true);
      if (!/^\d{3,4}$/.test(d.cvv || '')) return toast('CVV must be 3 or 4 digits.', true);
      const brand = num[0] === '4' ? 'Visa' : num[0] === '5' ? 'Mastercard' : 'Card';
      detail = `${brand} •••• ${num.slice(-4)}`;
    } else {
      const ph = (d.momoNo || '').replace(/[^\d]/g, '');
      if (ph.length < 9) return toast('Enter a valid mobile money number.', true);
      detail = `${d.provider} •••• ${ph.slice(-4)}`;
    }
    const btn = $('#payBtn'); btn.disabled = true; btn.textContent = 'Processing…';
    setTimeout(() => {
      const payment = { id: 'pay_' + uid(), type: c.type, payerId: sessionUser().id, painterId: c.painterId, amount: c.amount, method: c.method, detail, ref: 'PC-' + uid().toUpperCase(), status: 'received', createdAt: Date.now() };
      db.payments.push(payment);
      const done = c.onSuccess;
      closeModal();
      done(payment);
      save();
      render();
    }, 900);
  }

  const actions = {
    'auth-tab': (el) => { S.authTab = el.dataset.v; render(); },
    'go': (el) => go(el.dataset.v),
    'back': () => go(defaultView(sessionUser())),
    'logout': () => { localStorage.removeItem(SESSION_KEY); S.view = 'auth'; S.authTab = 'login'; render(); },
    'open-painter': (el) => go('painter', el.dataset.id),
    'ptab': (el) => { S.ptab = el.dataset.v; render(); },
    'atab': (el) => { S.atab = el.dataset.v; render(); },
    'approve': (el) => { const p = userById(el.dataset.id); p.status = 'approved'; save(); toast(`${p.name} approved.`); render(); },
    'dismiss': (el) => { const p = userById(el.dataset.id); if (!confirm(`Dismiss ${p.name}? They will be hidden from clients.`)) return; p.status = 'dismissed'; save(); toast(`${p.name} dismissed.`); render(); },
    'del-work': (el) => { if (!confirm('Delete this work?')) return; db.works = db.works.filter((w) => w.id !== el.dataset.id); save(); render(); },
    'zoom': (el) => { const w = db.works.find((x) => x.id === el.dataset.id); showModal(`<img src="${w.image}" style="width:100%;border-radius:10px"><h3 style="margin-top:12px">${esc(w.title)}</h3><p class="muted">${esc(w.desc)}</p><button class="btn secondary" data-act="close-modal">Close</button>`); },
    'close-modal': () => closeModal(),
    'pay-method': (el) => { payCtx.method = el.dataset.v; renderPay(); },
    'reset': (el, e) => { e.preventDefault(); if (!confirm('Reset ALL demo data in this browser?')) return; localStorage.removeItem(SESSION_KEY); db = seed(); save(); S.view = 'auth'; render(); toast('Demo data reset.'); },
    'pay-listing': () => {
      const me = sessionUser();
      openPay({
        title: 'Painter Corp listing fee', amount: db.settings.painterFee, type: 'painter_fee', painterId: me.id,
        onSuccess: () => { me.status = 'pending'; toast('Payment received! Waiting for admin approval.'); },
      });
    },
  };

  const forms = {
    login: (f) => {
      const d = Object.fromEntries(new FormData(f));
      const u = db.users.find((x) => x.email.toLowerCase() === d.email.trim().toLowerCase() && x.password === d.password);
      if (!u) return toast('Wrong email or password.', true);
      localStorage.setItem(SESSION_KEY, u.id);
      S.view = defaultView(u); S.ptab = 'overview'; S.atab = 'overview';
      render(); toast(`Welcome, ${u.name}!`);
    },
    register: (f) => {
      const d = Object.fromEntries(new FormData(f));
      if (db.users.some((x) => x.email.toLowerCase() === d.email.trim().toLowerCase())) return toast('That email is already registered.', true);
      const u = { id: 'u_' + uid(), role: d.role, name: d.name.trim(), email: d.email.trim(), phone: d.phone.trim(), password: d.password, joined: Date.now() };
      if (u.role === 'painter') Object.assign(u, { status: 'unpaid', available: true, location: '', specialties: '', rate: '', bio: '' });
      db.users.push(u); save();
      localStorage.setItem(SESSION_KEY, u.id);
      S.view = defaultView(u); S.ptab = 'overview';
      render(); toast('Account created!');
    },
    profile: (f) => {
      const me = sessionUser(); const d = new FormData(f);
      ['name', 'phone', 'location', 'rate', 'specialties', 'bio'].forEach((k) => { me[k] = String(d.get(k) || '').trim(); });
      me.available = d.get('available') === 'on';
      save(); toast('Profile saved.'); render();
    },
    work: async (f) => {
      const me = sessionUser(); const file = f.image.files[0];
      if (!file) return toast('Choose a picture.', true);
      try {
        const image = await resizeImage(file);
        db.works.push({ id: 'w_' + uid(), painterId: me.id, title: f.title.value.trim(), desc: f.desc.value.trim(), image, createdAt: Date.now() });
        if (save()) { toast('Work posted.'); render(); } else { db.works.pop(); }
      } catch (e) { toast('Could not read that image.', true); }
    },
    hire: (f) => {
      const me = sessionUser(); const painterId = f.dataset.id; const d = Object.fromEntries(new FormData(f));
      openPay({
        title: `Service fee to unlock ${userById(painterId).name}'s contact details`, amount: db.settings.bookingFee, type: 'booking', painterId,
        onSuccess: (payment) => {
          db.bookings.push({ id: 'b_' + uid(), clientId: me.id, painterId, jobType: d.jobType, location: d.location.trim(), details: d.details.trim(), fee: payment.amount, paymentId: payment.id, createdAt: Date.now() });
          toast('Payment received — contact details unlocked!');
        },
      });
    },
    pay: (f) => finishPay(f),
    settings: (f) => {
      const d = Object.fromEntries(new FormData(f));
      db.settings.painterFee = Math.max(0, +d.painterFee || 0);
      db.settings.bookingFee = Math.max(0, +d.bookingFee || 0);
      save(); toast('Settings saved.'); render();
    },
  };

  function resizeImage(file, max = 900) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => {
        const img = new Image();
        img.onload = () => {
          const k = Math.min(1, max / Math.max(img.width, img.height));
          const c = document.createElement('canvas');
          c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          resolve(c.toDataURL('image/jpeg', 0.72));
        };
        img.onerror = reject; img.src = r.result;
      };
      r.onerror = reject; r.readAsDataURL(file);
    });
  }

  document.addEventListener('click', (e) => {
    if (e.target === $('#modal')) return closeModal();
    const el = e.target.closest('[data-act]');
    if (el && actions[el.dataset.act]) actions[el.dataset.act](el, e);
  });
  document.addEventListener('submit', (e) => {
    const f = e.target.closest('form[data-form]');
    if (!f) return;
    e.preventDefault();
    forms[f.dataset.form]?.(f);
  });
  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t.id === 'q') { S.q = t.value; renderGrid(); }
    if (t.id === 'cc') { t.value = t.value.replace(/\D/g, '').slice(0, 19).replace(/(.{4})/g, '$1 ').trim(); }
    if (t.id === 'exp') {
      let v = t.value.replace(/\D/g, '').slice(0, 4);
      if (v.length > 2) v = v.slice(0, 2) + '/' + v.slice(2);
      t.value = v;
    }
  });
  document.addEventListener('change', (e) => {
    if (e.target.id === 'availOnly') { S.availOnly = e.target.checked; renderGrid(); }
  });
  $('#brand').addEventListener('click', () => { const u = sessionUser(); if (u) go(defaultView(u)); });

  render();
})();
  </script>
</body>
</html>
